[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m2forecast"
version = "0.1.0"
description = "MLOps para previsão do crescimento mensal do M2 brasileiro (1, 3, 6 e 12 meses)"
requires-python = ">=3.10"
# Núcleo leve: é o que a API em produção (Vercel, só leitura) precisa.
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.1,<2.3",
    "sqlalchemy>=1.4.36,<2.1",
    "psycopg2-binary>=2.9",
    "pyyaml>=6",
    "requests>=2.31",
    "fastapi>=0.110",
]

[project.optional-dependencies]
# Modelos, otimização e MLflow: pipeline (GitHub Actions / Airflow), bootstrap e testes.
ml = [
    "scipy>=1.11",
    "statsmodels>=0.14.2,<0.15",
    "scikit-learn>=1.4,<1.7",
    "scikit-optimize>=0.10.2",
    "mlflow-skinny>=2.14,<3",
]
postgres = []  # mantido por compatibilidade: psycopg2 já está no núcleo
api = ["uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
